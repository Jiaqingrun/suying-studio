[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suying-engine"
version = "0.1.0"
description = "速影（Suying）本地混剪引擎 — Python FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "watchdog>=6.0.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pillow>=10.0.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.8.0",
  "edge-tts>=7.0.0",
  "cryptography",
]

[project.scripts]
suying-engine = "engine.main:main"
montage-engine = "engine.main:main"  # 兼容旧入口名

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "node_modules", "target", "dist", "build"]
